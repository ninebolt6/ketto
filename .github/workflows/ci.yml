name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { java: 21, gradle-args: "" }
          - { java: 25, gradle-args: "-PpaperNext" }
    name: build (java ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic

      - name: Build
        run: ./gradlew clean build --warning-mode all ${{ matrix.gradle-args }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java${{ matrix.java }}
          path: build/reports/tests/test
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { java: 21, gradle-args: "" }
          - { java: 25, gradle-args: "-PpaperNext" }
    name: e2e (java ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic

      - name: Cache Paper downloads
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches/run-task-jars/paper
          key: ${{ runner.os }}-run-paper-java${{ matrix.java }}-${{ hashFiles('gradle/libs.versions.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-run-paper-java${{ matrix.java }}-${{ hashFiles('gradle/libs.versions.toml') }}-

      - name: E2E tests
        run: ./gradlew e2eTest ${{ matrix.gradle-args }}

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports-java${{ matrix.java }}
          path: |
            build/e2e/
            build/reports/tests/e2eTest/
            build/test-results/e2eTest/
          retention-days: 7
