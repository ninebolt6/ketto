name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .java-version

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic

      - name: Verify tag matches project version
        run: |
          VERSION="$(./gradlew -q printVersion -Prelease)"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${VERSION} in build.gradle.kts"
            exit 1
          fi

      - name: Fail if release already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::error::Release ${GITHUB_REF_NAME} already exists; bump version in build.gradle.kts"
            exit 1
          fi

      - name: Build
        run: ./gradlew clean build -Prelease --warning-mode all

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Semver: a "-" suffix (v1.0.0-alpha) marks a prerelease
          PRERELEASE=""
          case "${GITHUB_REF_NAME}" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" build/libs/*.jar --generate-notes --verify-tag $PRERELEASE
