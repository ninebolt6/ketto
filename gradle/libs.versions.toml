[versions]
kotlin = "2.4.20"
paper = "1.21.11-R0.1-SNAPSHOT"
sqlite = "3.53.4.0"
junit = "6.1.3"
mockbukkit = "4.116.3"
mockk = "1.14.11"
archunit = "1.5.0"
ktlint-engine = "1.8.0"
ktlint-gradle = "14.2.0"
kover = "0.9.9"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
# Version resolves from paper-api's adventure-bom (server-provided, so it stays aligned)
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage" }
adventure-serializer-plain = { module = "net.kyori:adventure-text-serializer-plain" }
# Bundled with Paper at runtime (docs.papermc.io/paper/dev/using-databases); the pinned version mirrors paper-server's
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v1.21", version.ref = "mockbukkit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-power-assert = { id = "org.jetbrains.kotlin.plugin.power-assert", version.ref = "kotlin" }
ktlint-gradle = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
