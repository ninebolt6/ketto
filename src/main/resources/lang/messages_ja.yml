# 1vs1 メッセージ (日本語)
# MiniMessage 形式。<name> 等はプレースホルダ。新言語は lang/messages_<lang>.yml を置くだけで追加できる。
prefix: "<dark_gray>[<gold>1vs1<dark_gray>] "

usage:
  root: "<yellow>/1vs1 stats [player] | /1vs1 leave | /1vs1 arena <arena>"
  arena: "<yellow>/1vs1 arena <arena>"
  arena-ops: "<red>/1vs1 arena create <arena> | /1vs1 arena <arena> <info|remove|enable|disable|spawn|kit|sign>"
  lobby: "<red>/1vs1 lobby set"
  create: "<red>/1vs1 arena create <arena>"
  remove: "<red>/1vs1 arena <arena> remove"
  spawn: "<red>/1vs1 arena <arena> spawn set <1|2>"
  enable: "<red>/1vs1 arena <arena> enable"
  disable: "<red>/1vs1 arena <arena> disable"
  kit: "<red>/1vs1 arena <arena> kit set"
  sign: "<red>/1vs1 arena <arena> sign <set|remove>"
  sign-set: "<red>/1vs1 arena <arena> sign set"
  sign-remove: "<red>/1vs1 arena <arena> sign remove"

command:
  no-permission: "<red>権限がありません！"
  player-only: "<red>このコマンドはプレイヤーのみ実行可能です"
  blocked: "<red>コマンドは使用できません！"

lobby:
  set: "<green>ロビーを設定しました"

arena:
  exists: "<red>そのアリーナはすでに存在しています"
  not-found: "<red>そのアリーナは存在しません"
  created: "<green>アリーナ: <name> を作成しました"
  removed: "<green>アリーナ: <name> を削除しました"
  spawn-set: "<green>アリーナ: <name> のスポーン<slot>を設定しました"
  enabled: "<green>アリーナ: <name> を有効にしました"
  already-enabled: "<red>そのアリーナはすでに有効になっています！"
  disabled: "<green>アリーナ: <name> を無効にしました"
  already-disabled: "<red>そのアリーナはすでに無効です！"
  inventory-set: "<green>アリーナ: <name> のインベントリを設定しました"
  not-enabled: "<red>アリーナが有効になっていません！"
  info:
    header: "<yellow>=== <green>Arena[<aqua><bold><name><green>] <yellow>==="
    state: "<yellow>状態: <display>"
    versus: "<red>[<gold><name1><red>] vs [<gold><name2><red>]"
    wins: "<yellow>勝数: <green><wins1>-<wins2>"

match:
  joined: "<green>アリーナ: <name> に参加しました"
  wait-one-more: "<yellow>あと一人参加するのを待っています。"
  already-joined: "<red>すでに他のアリーナに参加しています"
  in-game: "<red>このアリーナは現在ゲーム中です"
  left: "<red>アリーナから退出しました"
  cannot-leave: "<red>カウントダウン中はアリーナから退出できません！"
  not-joined: "<red>あなたはアリーナに参加していません！"
  teleport-in: "<green>テレポートまで: <n>秒"
  game-start: "<green>ゲームスタート！"
  start-in: "<green>開始まで: <n>秒"
  round-start: "<green>スタート！"
  round-winner: "<aqua>ラウンド[<gold><round><aqua>] 勝者: <name>"
  champion: "<yellow>アリーナ: <arena>で<red><name>が優勝しました！"

stats:
  win: "<red>Win: <aqua><wins>"
  lose: "<red>Lose: <aqua><losses>"
  ratio: "<red>W/L(勝率): <aqua><ratio>"
  none: "<red>Statsが存在しません"
  cooldown: "<red>戦績の検索は連続で実行できません。しばらく待ってください"

sign:
  look-at: "<red>看板を見て実行してください"
  taken: "<red>その看板はすでに登録されています"
  removed: "<green>アリーナ: <name> の看板登録を解除しました"
  not-registered: "<red>そのアリーナには看板が登録されていません"
  title: "<dark_red>[<gold><bold>1vs1<dark_red>]"
  arena: "<aqua><name>"
  join: "<blue>Join"
  cannot-join: "<dark_red>Cannot join"

state:
  waiting: "<green>Waiting"
  onemore: "<yellow>1 More"
  countdown: "<red>Countdown"
  ingame: "<red><bold>Ingame"

scoreboard:
  title: "<green><bold><arena>"
  entry: "<gold><name>"
